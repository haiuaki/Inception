# --- Services layer -------------------------------------------------------- // 

services:
  # NGINX: Reverse Proxy & TLS encryption entrypoint
  nginx:
    build: requirements/nginx
    container_name: nginx
    restart: always
    depends_on:
      - wordpress
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - wordpress_volume:/var/www/html

  # MariaDB: Relational database engine storing WordPress data 
  mariadb:
    build: requirements/mariadb
    container_name: mariadb
    restart: always
    env_file:
      - .env
    networks:
      - inception
    volumes:
      - mariadb_volume:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password

  # WordPress: FastCGI server generatic dynamic website content
  wordpress:
    build: requirements/wordpress
    container_name: wordpress
    restart: always
    depends_on:
      - mariadb
    env_file:
      - .env
    networks:
      - inception
    volumes:
      - wordpress_volume:/var/www/html
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password


# --- Networking layer ------------------------------------------------------ // 

networks:
  inception:
    driver: bridge # Virtual Software Router

# --- Volumes layer --------------------------------------------------------- //

volumes:
  mariadb_volume:
    driver: local
    driver_opts:
      type: none # Not use the default hidden volume formatting
      o: bind # Force to bind to a physical folder
      device: /home/${USER_LOGIN}/data/mariadb

  wordpress_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER_LOGIN}/data/wordpress


# --- Secrets layer --------------------------------------------------------- //

secrets:
  db_password:
    file: ../secrets/db_password.txt

  db_root_password:
    file: ../secrets/db_root_password.txt

  wp_admin_password:
    file: ../secrets/wp_admin_password.txt

  wp_user_password:
    file: ../secrets/wp_user_password.txt
