<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock | Inception Bonus</title>
    <link rel="stylesheet" href="style.css">
    <!-- Using a monospace font for that digital look -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="clock-container">
        <div class="digital-clock">
            <span id="hours">00</span><span class="colon">:</span><span id="minutes">00</span><span class="colon">:</span><span id="seconds">00</span>
            <span id="ampm">AM</span>
        </div>
        <div class="date-display" id="date">LOADING...</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
