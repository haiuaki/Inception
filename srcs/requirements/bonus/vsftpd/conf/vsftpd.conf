listen=YES
listen_ipv6=NO

# Disable anonymous login, require authentication
anonymous_enable=NO
local_enable=YES

# Allow the user to upload/modify files
write_enable=YES
local_umask=022

# Networking and ports
connect_from_port_20=YES
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110

# Security: Lock the user into the WordPress directory
chroot_local_user=YES
local_root=/var/www/html
allow_writeable_chroot=YES
seccomp_sandbox=NO

# Only allow users in the userlist to log in
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO
